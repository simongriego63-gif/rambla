<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>beki - Horizontal Bloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F4EFE6; /* Crema muy elegante */
            --bg-card: #FFFFFF;
            --dark: #2A2015; /* Marrón café oscuro */
            --accent: #D35400; /* Naranja tostado */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
        
        /* Contenedor Interactivo */
        .interaction-wrapper { position: relative; width: 100%; max-width: 360px; height: 400px; display: flex; justify-content: center; align-items: flex-start; margin-top: 50px;}
        
        /* Panel Trasero (El QR) */
        .back-panel {
            position: absolute; top: 0; width: 340px; height: 220px; background: #EAE3D5;
            border-radius: 20px; border: 2px dashed #C8BCA7; z-index: 1;
            display: flex; flex-direction: column; align-items: center; padding-top: 25px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.05);
        }
        .qr-box { background: #fff; padding: 10px; border-radius: 12px; position: relative; overflow: hidden; border: 2px solid var(--dark);}
        .qr-box img { width: 100px; height: 100px; display: block; }
        
        /* Efecto Láser del QR */
        .laser { position: absolute; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 10%; opacity: 0;} 10% { opacity: 1;} 90% { opacity: 1;} 100% { top: 90%; opacity: 0;} }

        /* Tarjeta Frontal Horizontal */
        .front-card {
            position: absolute; top: 0; width: 360px; height: 210px; background: var(--bg-card);
            border-radius: 20px; border: 2px solid var(--dark); box-shadow: 0 15px 35px rgba(42,32,21,0.15);
            z-index: 2; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Pestaña superior para tirar */
        .tab-pull {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 28px; background: var(--dark); border-radius: 12px 12px 0 0;
            color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; border: 2px solid var(--dark); border-bottom: none;
        }

        /* ESTADO BLOOM (Revelado) */
        .interaction-wrapper.bloomed .front-card { transform: translateY(160px); }
        .interaction-wrapper.bloomed .tab-pull { background: var(--accent); border-color: var(--accent); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo-text { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
        .user-name { font-weight: 800; color: var(--dark); font-size: 14px; text-align: right; }
        
        .stamps-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
        .stamp-item { width: 32px; height: 32px; position: relative; }
        
        /* Tazas Minimalistas y Floración */
        .stamp-item svg { width: 100%; height: 100%; fill: none; stroke: rgba(42,32,21,0.2); stroke-width: 2; transition: all 0.4s; }
        .stamp-item.filled svg { stroke: var(--dark); }
        .stamp-item.filled .flower-bloom { fill: var(--accent); stroke: none; animation: popFlower 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform-origin: center;}
        
        @keyframes popFlower { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .bottom-info { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--dark); margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* Login Básico oculto por defecto */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        input, button { width: 100%; max-width: 300px; padding: 15px; border-radius: 12px; border: 2px solid var(--dark); margin-bottom: 15px; font-weight: bold; font-family: 'Inter'; }
        button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h1 style="font-family: 'Montserrat'; color: #D35400; font-size: 40px; margin-bottom: 20px;">beki.</h1>
        <input type="text" id="inNombre" placeholder="Tu Nombre">
        <input type="tel" id="inTel" placeholder="WhatsApp (Ej: 2215551234)">
        <button onclick="iniciarApp()">Entrar a mi Tarjeta</button>
    </div>

    <div class="interaction-wrapper" id="mainWrapper" style="display:none;">
        
        <div class="back-panel">
            <div style="font-size: 10px; font-weight: 800; color: #D35400; letter-spacing: 2px; margin-bottom: 10px;">ESCANEAR PARA SUMAR</div>
            <div class="qr-box">
                <div class="laser"></div>
                <img id="qrImg" src="" alt="QR">
            </div>
        </div>

        <div class="front-card">
            <div class="tab-pull" onclick="toggleBloom()">≡</div>
            
            <div class="card-header">
                <div class="logo-text">beki.</div>
                <div class="user-name" id="uiNom">...</div>
            </div>

            <div style="font-size: 10px; font-weight: 600; color: var(--dark); opacity: 0.6; margin-bottom: 10px;">PROGRESO ACTUAL</div>
            
            <div class="stamps-row" id="stampsRow">
                </div>

            <div class="bottom-info">
                <span>ESTADO: <span style="color: var(--accent);">ACTIVO</span></span>
                <span id="uiPtos">0/8</span>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCaqJraAXeZ8F4zCd9GUIdNIHhfU7FMzJk",
            authDomain: "club-cafe-app.firebaseapp.com",
            databaseURL: "https://club-cafe-app-default-rtdb.firebaseio.com",
            projectId: "club-cafe-app"
        });
        const db = getFirestore(app);

        window.toggleBloom = () => {
            document.getElementById('mainWrapper').classList.toggle('bloomed');
        };

        window.iniciarApp = async () => {
            const nom = document.getElementById('inNombre').value;
            const tel = document.getElementById('inTel').value.replace(/\D/g,'');
            if(!nom || tel.length < 8) return alert("Completa los datos");

            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainWrapper').style.display = 'flex';
            document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${tel}&bgcolor=FFFFFF&color=2A2015`;

            await setDoc(doc(db, "clientes", tel), { nombre: nom }, { merge: true });

            onSnapshot(doc(db, "clientes", tel), (docSnap) => {
                if(docSnap.exists()) {
                    const d = docSnap.data();
                    document.getElementById('uiNom').innerText = d.nombre;
                    document.getElementById('uiPtos').innerText = `${d.puntos || 0}/8`;
                    dibujarSellos(d.puntos || 0);
                }
            });
        };

        function dibujarSellos(puntos) {
            const row = document.getElementById('stampsRow');
            row.innerHTML = '';
            for(let i=1; i<=8; i++) {
                const item = document.createElement('div');
                item.className = `stamp-item ${i <= puntos ? 'filled' : ''}`;
                
                // SVG de Taza que brota una flor
                item.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <path d="M25,40 H75 V70 Q75,85 60,85 H40 Q25,85 25,70 Z" />
                    <path d="M75,50 Q90,50 90,60 T75,70" />
                    ${i <= puntos ? '<path class="flower-bloom" d="M50,15 Q60,5 70,20 Q85,30 70,40 Q60,55 50,45 Q40,55 30,40 Q15,30 30,20 Q40,5 50,15 Z"/>' : ''}
                </svg>`;
                row.appendChild(item);
            }
        }
    </script>
</body>
</html>
