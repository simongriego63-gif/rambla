<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>beki CAFE - Tarjeta de Fidelidad</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styleop1.css">
</head>
<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="noise-overlay"></div>

    <div id="modalAlertaCustom" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
            <div id="textoAlertaCustom" class="modal-text">Mensaje de error</div>
            <button id="btnCerrarAlerta" class="btn-modal">Entendido</button>
        </div>
    </div>

    <div class="main-container">
        
        <div id="pantallaSkeleton">
            <div class="card glass-card">
                <div class="skeleton-header">
                    <div class="skeleton-block" style="width: 100px; height: 40px;"></div>
                    <div class="skeleton-block" style="width: 80px; height: 24px;"></div>
                </div>
                <div class="skeleton-stamps">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-circle"></div>
                </div>
                <div class="skeleton-block" style="width: 100%; height: 120px; margin-top: 24px;"></div>
                <div class="skeleton-block" style="width: 140px; height: 140px; margin: 24px auto 0; border-radius: 20px;"></div>
            </div>
        </div>

        <div id="pantallaRegistro">
            <div class="card glass-card registro-card">
                <div class="logo-section">
                    <div class="logo-badge">
                        <span class="logo-main">beki</span>
                        <span class="logo-sub">CAFE</span>
                    </div>
                    <div class="logo-tagline">ESPECIALIDAD</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Tu nombre</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="inputNombre" class="input-field" placeholder="Ej: Simon" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">WhatsApp</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <input type="tel" id="inputCelular" class="input-field" placeholder="Ej: 2215551234" required>
                    </div>
                </div>
                
                <button class="btn-primary" id="btnCrearTarjeta">
                    <span>Crear / Entrar a mi Tarjeta</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
                
                <button id="btnInstalarApp" class="btn-install">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Instalar app
                </button>
            </div>
        </div>

        <div id="pantallaTarjeta">
            <p class="tap-hint">Toca la tarjeta para girarla</p>
            
            <div class="flip-container" onclick="this.classList.toggle('flipped')">
                <div class="flipper">
                    
                    <div class="front">
                        <div class="card glass-card wallet-card">
                            <div class="card-header">
                                <div class="brand-section">
                                    <span class="brand-logo">beki</span>
                                    <span class="brand-text">CAFE</span>
                                </div>
                                <div class="user-section">
                                    <div class="user-name" id="displayNombre">...</div>
                                    <div class="user-phone" id="displayTelLabel">******0000</div>
                                </div>
                            </div>
                            
                            <div class="progress-section">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                                <div class="progress-text">
                                    <span id="displayPuntos">0</span>/8 sellos
                                </div>
                            </div>
                            
                            <div class="stamps-section">
                                <div class="stamps-grid" id="gridSellos"></div>
                            </div>
                            
                            <div class="benefits-section">
                                <div class="benefit-card" data-benefit="3">
                                    <div class="benefit-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
                                            <path fill="currentColor" d="m20.725 17.825 -2.775 -1 2.075 -5.125 2.125 4.375c0.33335 0.66665 0.325 1.17915 -0.025 1.5375 -0.35 0.35835 -0.81665 0.42915 -1.4 0.2125Zm-6.15 -0.45 1.55 -9.575c0.0667 -0.38335 0.2125 -0.65 0.4375 -0.8 0.225 -0.15 0.5292 -0.15 0.9125 0l1.65 0.65c0.3167 0.13335 0.5375 0.32085 0.6625 0.5625 0.125 0.24165 0.1125 0.54585 -0.0375 0.9125l-3.375 8.25h-1.8Zm-6.7 0 -3.37499 -8.25c-0.13333 -0.33335 -0.14583 -0.62915 -0.0375 -0.8875 0.108335 -0.25835 0.32917 -0.45415 0.66249 -0.5875l1.65 -0.65c0.33335 -0.13335 0.62085 -0.14165 0.8625 -0.025 0.2417 0.11665 0.4042 0.39165 0.4875 0.825l1.55 9.575h-1.8Zm-4.34999 0.45c-0.58333 0.21665 -1.05 0.14585 -1.4 -0.2125 -0.35 -0.35835 -0.35833 -0.87085 -0.025 -1.5375l2.125 -4.375L6.3 16.825l-2.77499 1Zm7.39999 -0.45 -1.65 -10.7c-0.0833 -0.55 0.025 -0.96665 0.325 -1.25s0.725 -0.425 1.275 -0.425h2.5c0.55 0 0.975 0.14165 1.275 0.425 0.3 0.28335 0.40835 0.7 0.325 1.25l-1.65 10.7h-2.4Z"/>
                                        </svg>
                                    </div>
                                    <div class="benefit-info">
                                        <span class="benefit-title">10% OFF laminados</span>
                                        <span id="refStatus3" class="benefit-status"></span>
                                    </div>
                                </div>
                                
                                <div class="benefit-card" data-benefit="5">
                                    <div class="benefit-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
                                            <path fill="currentColor" d="m11.4251 14.3501 -6.80002 -0.8c-0.31667 -0.03335 -0.525 -0.20415 -0.625 -0.5125 -0.1 -0.30835 -0.033335 -0.57085 0.2 -0.7875l11.00002 -10.1c0.06665 -0.05 0.1375 -0.09167 0.2125 -0.125 0.075 -0.033335 0.1875 -0.05 0.3375 -0.05 0.25 0 0.44165 0.104165 0.575 0.3125 0.1333 0.20833 0.1333 0.42083 0 0.6375l-3.75 6.725 6.8 0.8c0.31665 0.03335 0.525 0.20415 0.625 0.5125 0.1 0.30835 0.0333 0.57085 -0.2 0.7875l-11 10.1c-0.0667 0.05 -0.1375 0.09165 -0.2125 0.125 -0.075 0.03335 -0.1875 0.05 -0.3375 0.05 -0.25 0 -0.4417 -0.10415 -0.575 -0.3125 -0.13335 -0.20835 -0.13335 -0.42085 0 -0.6375l3.75 -6.725Z"/>
                                        </svg>
                                    </div>
                                    <div class="benefit-info">
                                        <span class="benefit-title">Barrita GRATIS</span>
                                        <span id="refStatus5" class="benefit-status"></span>
                                    </div>
                                </div>
                                
                                <div class="benefit-card benefit-final" data-benefit="8">
                                    <div class="benefit-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14" width="22" height="22">
                                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.5356 10.5355c-2.53843 2.5384 -6.17913 3.0132 -8.13175 1.0606C0.45123 9.6435 0.926103 6.0028 3.46451 3.46439 6.00292 0.925981 9.64362 0.451108 11.5962 2.40373c1.9527 1.95262 1.4778 5.59332 -1.0606 8.13177Z"/>
                                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.5962 2.40381s-0.3536 2.47487 -1.76777 3.88909c-1.41421 1.41421 -4.24264 0 -5.65685 1.41421 -1.41422 1.41421 -1.76777 3.88909 -1.76777 3.88909"/>
                                        </svg>
                                    </div>
                                    <div class="benefit-info">
                                        <span class="benefit-title">Cafe GRATIS</span>
                                        <span id="displayPremio" class="benefit-status"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="qr-section">
                                <div class="qr-frame">
                                    <div class="qr-corner qr-corner-tl"></div>
                                    <div class="qr-corner qr-corner-tr"></div>
                                    <div class="qr-corner qr-corner-bl"></div>
                                    <div class="qr-corner qr-corner-br"></div>
                                    <img id="qrImage" src="" alt="QR Cliente">
                                </div>
                                <div class="qr-label">Tu codigo personal</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="back">
                        <div class="back-content">
                            <div class="back-logo">
                                <span class="back-logo-main">beki</span>
                                <span class="back-logo-sub">CAFE</span>
                            </div>
                            <div class="back-tagline">ESPECIALIDAD</div>
                            <div class="back-decoration">
                                <div class="deco-ring"></div>
                                <div class="deco-ring"></div>
                                <div class="deco-ring"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="btnCerrarSesion" class="btn-logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Cerrar sesion
            </button>
        </div>
    </div>

    <div id="confettiContainer"></div>

    <script type="module" src="js/app-op1.js"></script>
    
</body>
</html>
